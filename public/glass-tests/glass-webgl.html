<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONEMO glass — WebGL transmission (real refraction, GPU, Safari-smooth)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#111}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  .cap{position:fixed;top:12px;left:14px;z-index:5;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.6;font-weight:600}
  .fps{position:fixed;top:12px;right:14px;z-index:5;font-size:12px;color:#0f0;font-variant-numeric:tabular-nums;opacity:.8}
  .panel{position:fixed;left:10px;right:10px;bottom:10px;z-index:9;
    background:rgba(250,250,250,.85);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(0,0,0,.08);border-radius:20px;padding:11px 13px 12px;
    display:grid;grid-template-columns:auto 1fr auto;gap:7px 12px;align-items:center;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .panel h4{grid-column:1/-1;margin:0 0 2px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
  .panel label{opacity:.75;white-space:nowrap}
  .panel input[type=range]{width:100%}
  .panel .val{font-variant-numeric:tabular-nums;opacity:.85;min-width:44px;text-align:right}
</style>
</head>
<body>
  <div class="cap">ONEMO glass · WebGL transmission</div>
  <div class="fps" id="fps">–</div>
  <canvas id="c"></canvas>

  <div class="panel">
    <h4>Physical glass — tune on device, read back to Kai</h4>
    <label>IOR</label><input id="s_ior" type="range" min="100" max="200" value="150"><span class="val" id="v_ior">1.50</span>
    <label>Thickness</label><input id="s_thk" type="range" min="0" max="300" value="80"><span class="val" id="v_thk">0.80</span>
    <label>Roughness</label><input id="s_rgh" type="range" min="0" max="40" value="4"><span class="val" id="v_rgh">.04</span>
    <label>Light</label><input id="s_env" type="range" min="0" max="300" value="130"><span class="val" id="v_env">1.30</span>
    <label>Lens size</label><input id="s_scl" type="range" min="50" max="180" value="100"><span class="val" id="v_scl">1.00</span>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,100);
camera.position.set(0,0,10);

// environment (soft studio light → the glass specular/rim, no tacky hotspot)
const pmrem=new THREE.PMREMGenerator(renderer);
const envRT=pmrem.fromScene(new RoomEnvironment(),0.04);
scene.environment=envRT.texture;

// ── technical backdrop: grayscale vertical bars + big text (refraction is obvious) ──
function makeBackdrop(){
  const cvs=document.createElement('canvas');cvs.width=1024;cvs.height=2048;
  const g=cvs.getContext('2d');
  const steps=['#333','#4d4d4d','#6a6a6a','#888','#a6a6a6','#c4c4c4','#e0e0e0','#f5f5f5'];
  const bw=cvs.width/steps.length;
  steps.forEach((c,i)=>{g.fillStyle=c;g.fillRect(i*bw,0,bw+1,cvs.height)});
  g.fillStyle='rgba(0,0,0,.35)';g.font='800 300px -apple-system,sans-serif';g.textAlign='center';
  g.save();g.translate(cvs.width/2,cvs.height*0.32);g.fillText('ONEMO',0,0);g.restore();
  g.fillStyle='rgba(255,255,255,.5)';g.save();g.translate(cvs.width/2,cvs.height*0.64);g.fillText('GLASS',0,0);g.restore();
  const t=new THREE.CanvasTexture(cvs);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const bgTex=makeBackdrop();
const bgPlane=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:bgTex}));
bgPlane.position.z=-4;scene.add(bgPlane);
function fitBackdrop(){
  const dist=camera.position.z-bgPlane.position.z;
  const h=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*dist;
  const w=h*camera.aspect;
  bgPlane.scale.set(w,h,1);
}

// ── glass lenses: real physical transmission (refracts the backdrop on GPU) ──
const mat=new THREE.MeshPhysicalMaterial({
  transmission:1, roughness:0.04, metalness:0, ior:1.5, thickness:0.8,
  specularIntensity:1, clearcoat:1, clearcoatRoughness:0.02,
  envMapIntensity:1.3, attenuationColor:new THREE.Color('#ffffff'), attenuationDistance:2
});
// convex lens = flattened sphere → strong, obvious edge refraction
const lensGeo=new THREE.SphereGeometry(1,64,64);
const lenses=[];
const layout=[[-1.4,1.6,0.9],[1.4,1.6,0.9],[-1.9,-0.2,0.55],[0,-0.2,0.55],[1.9,-0.2,0.55],[0,-2.1,1.15]];
for(const [x,y,r] of layout){
  const m=new THREE.Mesh(lensGeo,mat);
  m.position.set(x,y,0.6);
  m.scale.set(r,r,r*0.32);        // flatten Z → lens/button, not a ball
  m.userData.base=[x,y,r];
  scene.add(m);lenses.push(m);
}

// pointer parallax (shows smoothness while things move — the Safari perf test)
let px=0,py=0;
addEventListener('pointermove',e=>{px=(e.clientX/innerWidth-.5);py=(e.clientY/innerHeight-.5);},{passive:true});

let sizeScale=1;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitBackdrop();}
addEventListener('resize',resize);resize();

// sliders
const bind=(id,fmt,apply)=>{const s=document.getElementById('s_'+id),v=document.getElementById('v_'+id);
  const on=()=>{const n=+s.value;v.textContent=fmt(n);apply(n);};s.addEventListener('input',on);on();};
bind('ior',n=>(n/100).toFixed(2),n=>mat.ior=n/100);
bind('thk',n=>(n/100).toFixed(2),n=>mat.thickness=n/100);
bind('rgh',n=>(n/100).toFixed(2),n=>mat.roughness=n/100);
bind('env',n=>(n/100).toFixed(2),n=>mat.envMapIntensity=n/100);
bind('scl',n=>(n/100).toFixed(2),n=>{sizeScale=n/100;for(const m of lenses){const [,,r]=m.userData.base;m.scale.set(r*sizeScale,r*sizeScale,r*sizeScale*0.32);}});

// fps
let last=performance.now(),frames=0,acc=0;const fpsEl=document.getElementById('fps');
function loop(t){
  const dt=t-last;last=t;frames++;acc+=dt;
  if(acc>=500){fpsEl.textContent=Math.round(1000/(acc/frames))+' fps';frames=0;acc=0;}
  // gentle float + pointer parallax
  const time=t*0.001;
  lenses.forEach((m,i)=>{const [bx,by]=m.userData.base;
    m.position.x=bx+px*1.2+Math.sin(time*0.6+i)*0.06;
    m.position.y=by-py*1.2+Math.cos(time*0.5+i)*0.06;
    m.rotation.z=Math.sin(time*0.3+i)*0.08;});
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
