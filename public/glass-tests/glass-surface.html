<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONEMO glass on the real surface</title>
<link rel="stylesheet" href="glass.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,system-ui,sans-serif;color:#111}
  /* ── ONEMO noise surface (light grain, like the Figma mockup) ── */
  body{min-height:100dvh;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>"),
      linear-gradient(180deg,#ececed,#e4e4e6);
    background-blend-mode:overlay;}
  .phone{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

  .status{display:flex;align-items:center;justify-content:space-between;padding:14px 26px 6px;font-weight:600;font-size:15px}
  .status .island{width:96px;height:30px;background:#000;border-radius:16px}
  .status .rt{display:flex;gap:6px;align-items:center;opacity:.9}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px}
  .topbar .title{font-size:19px;font-weight:600}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:min(80vw,320px);aspect-ratio:1/1.08;border-radius:34px;position:relative;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 20%,#fafafa,#e9e9ec 60%,#dedee1);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 20px 50px rgba(0,0,0,.18)}
  .card .prod{position:absolute;inset:14% 20% 8%;border-radius:50%/8%;
    background:radial-gradient(60% 45% at 50% 30%,#c7d64a,#9bb02a 55%,#5f7016);
    box-shadow:0 24px 40px rgba(0,0,0,.28);filter:saturate(1.1)}
  .card .dome{position:absolute;inset:10% 16% 4%;border-radius:46%/50% 50% 8% 8%;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 30%,transparent 60%);
    box-shadow:inset 0 2px 8px rgba(255,255,255,.6);mix-blend-mode:screen;pointer-events:none}

  .dockwrap{display:flex;justify-content:center;padding:6px 16px}
  .dock{display:flex;gap:6px;padding:10px 12px;--r:26px}
  .dock .tab{width:56px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;position:relative;z-index:2}
  .dock .tab .ic{font-size:22px;line-height:1}
  .dock .tab .lb{font-size:11px;font-weight:600;opacity:.8}

  .safari{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px 22px}
  .safari .addr{flex:1;max-width:220px;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;--r:22px;font-weight:600}

  .panel{position:static;width:max-content;margin:14px auto 20px;
    background:rgba(250,250,250,.8);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:9px 12px;
    display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .panel button{font:inherit;padding:8px 14px;border-radius:11px;border:1px solid rgba(0,0,0,.12);background:#fff;color:#111;font-weight:600}
  .panel button.on{background:#111;color:#fff;border-color:#111}
  .panel .g{opacity:.55;font-variant-numeric:tabular-nums}
</style>
</head>
<body class="idle">
  <div class="phone">
    <div class="status"><span>9:41</span><span class="island"></span><span class="rt">▟ ▂ ▉</span></div>

    <div class="topbar">
      <button class="glass round" style="width:44px;height:44px"><span class="base"></span><span class="glyph">✕</span></button>
      <span class="title">Effect</span>
      <button class="glass round" style="width:44px;height:44px"><span class="base"></span><span class="glyph">✓</span></button>
    </div>

    <div class="stage">
      <div class="card"><div class="prod"></div><div class="dome"></div></div>
    </div>

    <div class="dockwrap">
      <div class="glass pill dock"><span class="base"></span>
        <div class="tab"><span class="ic">⊕</span><span class="lb">Add</span></div>
        <div class="tab"><span class="ic">◗</span><span class="lb">Shape</span></div>
        <div class="tab"><span class="ic">✦</span><span class="lb">Effect</span></div>
        <div class="tab"><span class="ic">▦</span><span class="lb">Tune</span></div>
        <div class="tab"><span class="ic">◉</span><span class="lb">Edit</span></div>
      </div>
    </div>

    <div class="safari">
      <button class="glass round" style="width:44px;height:44px"><span class="base"></span><span class="glyph">‹</span></button>
      <div class="glass pill addr"><span class="base"></span><span class="glyph" style="font-size:15px">apple.com ⟳</span></div>
      <button class="glass round" style="width:44px;height:44px"><span class="base"></span><span class="glyph">⋯</span></button>
    </div>
  </div>

  <div class="panel">
    <button id="b_gyro">Enable tilt (gyro)</button>
    <button id="b_idle" class="on">Idle</button>
    <span class="g" id="g">gyro: off</span>
  </div>

<script>
const body=document.body, gEl=document.getElementById('g');
const bGyro=document.getElementById('b_gyro'), bIdle=document.getElementById('b_idle');
bIdle.onclick=()=>{body.classList.add('idle');bIdle.classList.add('on');bGyro.classList.remove('on');};
function onOrient(e){const g=e.gamma||0,b=e.beta||0;const a=Math.atan2(g,b)*180/Math.PI;
  document.documentElement.style.setProperty('--angle',a.toFixed(1)+'deg');gEl.textContent='gyro: '+a.toFixed(0)+'°';}
bGyro.onclick=async()=>{try{
  if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
    const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted'){gEl.textContent='gyro: denied';return;}}
  window.addEventListener('deviceorientation',onOrient);
  body.classList.remove('idle');bGyro.classList.add('on');bIdle.classList.remove('on');gEl.textContent='gyro: on — tilt';
}catch(err){gEl.textContent='gyro: '+err.message;}};
</script>
</body>
</html>
