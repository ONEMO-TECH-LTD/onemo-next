<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./support.js"></script>
<!-- Spotify-parity: theme-color MATCHES the surface top colour, so the launch-state opaque status bar reads as the surface (seamless); on scroll iOS makes it truly transparent and the real surface shows through. Sampled top-strip = #eff1f3..#f4f5f6 -> #f1f3f5. -->
<meta name="theme-color" content="#f1f3f5">
<style id="_phonefix">
/* Safari 26 (per spec): viewport-fit=cover + a REAL background on BOTH html AND body. A transparent body makes Safari draw a white/black fallback bar under the chrome — that was the "not filling / padded" bug. theme-color is IGNORED in Safari 26, so the surface itself must carry the look. Root background = canvas-fixed (fills under bars, doesn't scroll). */
html{margin:0!important;min-height:100%!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-x!important;overscroll-behavior:none!important;background-color:#edeff1!important;background-image:url(assets/grain1x.png),radial-gradient(140% 95% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 62%),linear-gradient(180deg,#e7eaed 0%,#edeff1 45%,#f3f4f6 100%)!important;background-size:207px 207px,100% 100lvh,100% 100lvh!important;background-repeat:repeat,no-repeat,no-repeat!important;background-position:0 0,top center,top center!important;background-blend-mode:overlay,normal,normal!important;image-rendering:pixelated!important;}
body{margin:0!important;min-height:calc(100lvh + 140px)!important;touch-action:pan-x!important;overscroll-behavior:none!important;background-color:#edeff1!important;background-image:url(assets/grain1x.png)!important;background-size:207px 207px!important;background-repeat:repeat!important;background-blend-mode:overlay!important;image-rendering:pixelated!important;}
/* Editor in NORMAL FLOW (NOT position:fixed). Safari 26 Liquid Glass: a fixed/sticky element near the bottom turns the toolbar into an opaque frosted panel; with no fixed element, content scrolls under and the bottom bar stays CLEAR. So the editor must not be fixed — it micro-scrolls instead. */
#dc-root{height:100lvh!important;margin-top:140px!important;}
#dc-root>.sc-host,.sc-host{height:100%!important;min-height:100%!important;}
[data-theme]{height:100%!important;}
/* SURFACE lives ONLY on the fixed html background (background-attachment:fixed → static, full-screen, never scrolls). The app's own surface + grain are zeroed so the noise can't be part of the scrollable content and tear at the bottom. */
[data-anat="screen surface"]{background:transparent!important;}
[data-anat="grain"]{display:none!important;}
[data-anat="top-section"]{padding-top:env(safe-area-inset-top,0px)!important;}
[data-anat="dock"]{margin-bottom:calc(env(safe-area-inset-bottom,0px) + 60px)!important;}
[data-anat="dial"] svg{width:100%!important;height:100%!important;}
[data-anat="bottom-section"]{height:auto!important;}
[data-anat="tool-box"]{padding-left:calc(50% - var(--sem-dim-fluid-big-m)/2)!important;padding-right:calc(50% - var(--sem-dim-fluid-big-m)/2)!important;}
[data-anat="content-col"]{max-width:clamp(560px,194px + 47.6cqi,880px)!important;margin-inline:auto!important;padding:0!important;}
[data-anat="tab-bar"]{width:auto!important;gap:12px!important;padding-left:12px!important;padding-right:12px!important;}
[data-anat="tab-bar"] button{width:auto!important;min-width:0!important;flex:none!important;padding-left:6px!important;padding-right:6px!important;}
[data-anat="Effect"]{width:clamp(320px,242.5px + 19.27cqi,520px)!important;height:clamp(320px,242.5px + 19.27cqi,520px)!important;}
@container (max-width:402px){[data-anat="Effect"]{width:clamp(258px,-275.4px + 148.1cqi,320px)!important;height:clamp(258px,-275.4px + 148.1cqi,320px)!important;}}
</style>

<x-dc>
<helmet>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="tokens-v2/tokens.css">
<link rel="stylesheet" href="tokens-v2/onemo-app-vars.css">
<style>
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  html,body{margin:0;padding:0;}
  button{font-family:inherit;}
  .om-scroll::-webkit-scrollbar{display:none;}
  i[class*="ph-"]{line-height:1;display:block;}
  @keyframes titleIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

  /* Responsive: phone = full-bleed single column; tablet/desktop = stage full-bleed + centered capped column */
  @container (min-width:768px){
    [data-anat="content-col"]{ max-width:var(--sem-container-md); margin-inline:auto; }
    [data-anat="status-bar"]{ display:none !important; }
  }


  /* ── ONEMO DS token application (NORMALISED) ──────────────────────────────
     ✓ = real DS token (auto theme-flips). GAP = DS silent → documented on Storybook. */
  :root{
    --editor-stage-bg: radial-gradient(140% 95% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 62%),linear-gradient(180deg,#e7eaed 0%,#edeff1 45%,#f3f4f6 100%); /* GAP aluminium-stage */
    --editor-grain-opacity: .5;                                          /* GAP noise */
    --editor-fg-strong: var(--sem-col-text-primary);                /* ✓ brand-black */
    --editor-fg: var(--sem-col-fg-secondary);               /* ✓ control-ink → semantic-fg-secondary (grey-11, neutral, auto-flips) */
    --editor-fg-disabled: var(--sem-col-text-disabled);          /* ✓ →semantic-text-disabled (grey-8, auto-flips) */
    --editor-accent: var(--sem-col-fg-brand-secondary);          /* ✓ →semantic-fg-brand-secondary (blue-green-9) · ruler notch */
    --editor-accent-ring: var(--sem-col-border-brand);           /* ✓ →semantic-border-brand (blue-green-8) · dial arc, active tab text */
    --editor-accent-value: var(--sem-col-border-brand-alt);      /* ✓ →semantic-border-brand-alt (blue-green-7) · dial number */
    --editor-tool-ink: var(--sem-col-fg-primary);                /* ✓ →semantic-fg-primary (brand-black, auto-flips) */
    --editor-tool-ink-muted: var(--sem-col-fg-secondary);        /* ✓ →semantic-fg-secondary (grey-11, auto-flips) */
    --editor-dock-ink: var(--sem-col-fg-white);                  /* ✓ →semantic-fg-white (constant — dock stays dark both themes) */
    --editor-dock-ink-muted: rgba(250,250,250,.55);               /* GAP dock-ink-muted */
    --editor-tick: rgba(10,13,18,.3);                             /* GAP ruler-tick */
    --editor-elevation-stage: 0 28px 54px -18px rgba(10,13,18,.5),inset 0 0 0 1px rgba(255,255,255,.06); /* GAP stage-elevation */
    --editor-glass-bg: rgba(255,255,255,.62);                    /* GAP glass-surface */
    --editor-glass-border: rgba(10,13,18,.07);                     /* GAP glass-hairline */
    --editor-circle-bg: rgba(255,255,255,.6);                    /* GAP glass-control */
    --editor-bezel-bg: #20252b;                                       /* GAP stage-bezel */
    --editor-viewer-bg: radial-gradient(125% 120% at 50% 14%,#5d6c79 0%,#46535f 44%,#2f3a44 100%); /* GAP viewer-material */
    --editor-tool-track: rgba(10,13,18,.12);                       /* GAP dial-track */
    --editor-dock-bg: #071013;                                   /* GAP dock */
    --editor-dock-border: linear-gradient(160deg,rgba(255,255,255,.55),rgba(120,130,140,.12) 42%,rgba(10,13,18,.65)); /* GAP metallic-border */
    --editor-swatch-shadow: inset 0 1px 1px rgba(255,255,255,.3),inset 0 0 0 1px rgba(10,13,18,.12),0 1px 2px rgba(10,13,18,.14); /* GAP swatch-elevation */
    --editor-track-bg: rgba(10,13,18,.05);                        /* GAP segmented-track */
    --editor-elevation-1: 0 1px 2px rgba(10,13,18,.12);           /* GAP raised-control */
  }
  [data-theme="dark"]{
    /* Only NON-semantic component tokens need dark overrides; fg / fg-disabled / tool-ink(-muted) / accents auto-flip via their semantic source. */
    --editor-stage-bg: radial-gradient(140% 95% at 50% 0%,rgba(120,140,160,.16),rgba(255,255,255,0) 60%),linear-gradient(180deg,#23272c 0%,#1c2024 45%,#15181b 100%);
    --editor-grain-opacity: .6;
    --editor-glass-bg: rgba(255,255,255,.08); --editor-glass-border: rgba(255,255,255,.1);
    --editor-circle-bg: rgba(255,255,255,.1); --editor-tool-track: rgba(255,255,255,.14);
    --editor-dock-bg: rgba(255,255,255,.08);
    --editor-tick: rgba(255,255,255,.3);
    --editor-swatch-shadow: inset 0 1px 1px rgba(255,255,255,.18),inset 0 0 0 1px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.5);
    --editor-track-bg: rgba(255,255,255,.06);
    --editor-elevation-1: 0 1px 2px rgba(0,0,0,.5);
  }
</style>
</helmet>

<div data-theme="{{ themeAttr }}" style="display:flex;align-items:stretch;justify-content:center;width:100%;height:100%;font-family:var(--font-body);{{ accentVars }}">
<div data-anat="creator studio" data-fluid="container" style="position:relative;width:100%;height:100%;container-type:inline-size;overflow:hidden;">

    <div data-anat="screen surface" style="position:absolute;inset:0;background:var(--editor-stage-bg);">
      <div data-anat="grain" style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:var(--editor-grain-opacity);background-image:url(assets/grain1x.png);background-size:207px 207px;image-rendering:pixelated;"></div>
    </div>

    <div data-anat="content-col" style="position:relative;height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:var(--sem-dim-fluid-standard-xl) var(--sem-dim-fluid-standard-m);">

      <!-- top nav: undo/redo · title · done/more -->
      <div data-anat="top-section" style="flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--sem-dim-fluid-nano-xl);padding:var(--sem-dim-fluid-none);">
        <span data-anat="title" style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">{{ titleEl }}</span>
        <div data-anat="history" style="display:flex;align-items:center;gap:var(--sem-dim-fluid-nano-xl);">
        <div data-anat="undo-redo" style="display:flex;align-items:center;gap:var(--sem-dim-fluid-standard-s);padding:var(--sem-dim-fluid-nano-xl) var(--sem-dim-fluid-standard-s);border-radius:var(--sem-radii-full);background:var(--editor-glass-bg);box-shadow:inset 0 0 0 1px var(--editor-glass-border);">
          <button onClick="{{ noop }}" style="appearance:none;border:0;background:transparent;cursor:pointer;padding:0;color:var(--editor-fg);display:block;" data-anat="undo"><i class="ph ph-arrow-arc-left" style="font-size:var(--sem-dim-fluid-standard-l);"></i></button>
          <button onClick="{{ noop }}" style="appearance:none;border:0;background:transparent;cursor:pointer;padding:0;color:var(--editor-fg-disabled);display:block;" data-anat="redo"><i class="ph ph-arrow-arc-right" style="font-size:var(--sem-dim-fluid-standard-l);"></i></button>
        </div>
        </div>
        
        <div style="display:flex;align-items:center;gap:var(--sem-dim-fluid-nano-xl);">
          <dc-import name="RoundButton" icon="perspective" surface="glass" tone="neutral" anat="view-toggle" on-click="{{ noop }}" hint-size="40px,40px"></dc-import>
          <dc-import name="RoundButton" icon="dots-three" surface="glass" tone="neutral" anat="menu" on-click="{{ noop }}" hint-size="40px,40px"></dc-import>
        </div>
      </div>

      <!-- stage window -->
      <div data-anat="canvas-section" style="flex:1;display:flex;align-items:center;justify-content:center;padding:var(--sem-dim-fluid-none);">
        <div data-anat="Effect" style="position:relative;width:var(--sem-container-xxs);height:var(--sem-container-xxs);border-radius:38px;padding:var(--sem-dim-fluid-nano-xl);background:var(--editor-bezel-bg);box-shadow:var(--editor-elevation-stage);">
          <div data-anat="frame" style="position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--editor-viewer-bg);">
            <img data-anat="image" src="assets/effect-default.png" alt="Effect" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;" />
          </div>
        </div>
      </div>

      <!-- bottom control cluster (fixed height so the stage above never shifts) -->
      <div data-anat="bottom-section" style="flex:none;height:var(--prim-dim-256);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--sem-dim-fluid-none);">
        <div data-anat="toolbar" style="display:flex;align-items:center;justify-content:space-between;padding:var(--sem-dim-fluid-none) var(--sem-dim-fluid-none) var(--sem-dim-fluid-nano-2xl);"><dc-import name="RoundButton" icon="x" surface="solid" tone="neutral" anat="close" on-click="{{ noop }}" hint-size="40px,40px"></dc-import><sc-if value="{{ isAdjust }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:var(--sem-dim-fluid-nano-s);" data-anat="tune-switch">
                <sc-for list="{{ tuneModes }}" as="m" hint-placeholder-count="3"><button data-anat="segment" onClick="{{ m.onClick }}" style="appearance:none;border:0;cursor:pointer;padding:var(--sem-dim-fluid-nano-xl) var(--sem-dim-fluid-nano-2xl);border-radius:var(--sem-radii-full);background:{{ m.pillBg }};box-shadow:{{ m.pillShadow }};font-family:var(--font-primary);font-size:var(--sem-type-fluid-label-s-size);line-height:1;font-weight:{{ m.weight }};letter-spacing:var(--sem-type-fluid-label-s-letter-spacing);color:{{ m.txt }};transition:background .2s ease,color .2s ease;">{{ m.label }}</button></sc-for></div></sc-if><dc-import name="RoundButton" icon="check" surface="solid" tone="brand" anat="confirm" on-click="{{ noop }}" hint-size="40px,40px"></dc-import></div>


        <sc-if value="{{ isMaterial }}" hint-placeholder-val="{{ false }}">
          <div data-anat="swatch-row" style="display:flex;justify-content:center;align-items:flex-start;gap:var(--sem-dim-fluid-standard-s);padding:var(--sem-dim-fluid-standard-l) var(--sem-dim-fluid-standard-s) 0;">

<script>
/* Safari 26 scroll-runway lock: the editor is offset down 70px and the page is 70px taller.
   We scroll up by exactly 70px → the offset cancels visually (editor looks unmoved) but the
   scroll position is non-zero → Safari composites real page pixels → BOTH bars go transparent.
   Then we park/lock the scroll at 70 so the editor can't actually move. */
(function(){
  var OFFSET = 140;
  function park(){ if (Math.abs(window.scrollY - OFFSET) > 0.5) window.scrollTo(0, OFFSET); }
  function settle(){ park(); setTimeout(park, 50); setTimeout(park, 200); setTimeout(park, 600); }
  if (document.readyState === 'complete') settle();
  else window.addEventListener('load', settle);
  document.addEventListener('DOMContentLoaded', settle);
  // lock: snap back to the offset instantly on any scroll (backup to touch-action:pan-x)
  var ticking=false;
  window.addEventListener('scroll', function(){ if(!ticking){ ticking=true; requestAnimationFrame(function(){ park(); ticking=false; }); } }, {passive:true});
  window.addEventListener('resize', settle);
  window.addEventListener('orientationchange', settle);
})();
</script>
