<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>ONEMO shop · Effect reel</title>
<style>
  :root { --ink:#16191d; --mut:#6b737c; --font:"Chillax","Satoshi",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --sem-col-bg-app-primary:#fbfbfc; --sem-col-bg-app-quaternary:#e8e8ec; --sem-col-bg-control-vibrant:#e0e1e6; --sem-col-bg-control-accent:#8b8d98; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#e8e8ec; color:var(--ink); font-family:var(--font); }
  #surface { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }
  .app { position:relative; z-index:1; height:100%; max-width:402px; margin:0 auto; }
  .top { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:16px; right:16px; z-index:3; display:flex; justify-content:flex-end; pointer-events:none; }
  .bag { pointer-events:auto; position:relative; width:28px; height:28px; display:grid; place-items:center; border:0; background:none; color:var(--ink); cursor:pointer; }
  .bag svg { width:22px; height:22px; }
  .bag i { position:absolute; top:-3px; right:-5px; min-width:16px; height:16px; border-radius:8px; background:var(--ink); color:#fff; font:600 10px/16px var(--font); font-style:normal; text-align:center; }
  .reel { height:100%; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; overscroll-behavior:contain; }
  .reel::-webkit-scrollbar { display:none; }
  .slide { height:100%; scroll-snap-align:start; scroll-snap-stop:always; display:flex; flex-direction:column; justify-content:space-between; padding:calc(54px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom)); }
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .turn { width:304px; height:304px; perspective:1200px; cursor:pointer; }
  .flip { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.45,0,.55,1); }
  .flip.back { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:52px; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 26px 50px -18px rgba(10,13,18,.55); }
  .face.b { transform:rotateY(180deg); }
  .face canvas { width:100%; height:100%; display:block; }
  .dots { display:flex; gap:8px; align-items:center; }
  .dots b { width:6px; height:6px; border-radius:3px; background:rgba(22,25,29,.3); transition:width .2s; }
  .dots b.on { width:14px; background:var(--ink); }
  .info { display:flex; flex-direction:column; gap:8px; }
  .name { font:500 18px/1.1 var(--font); }
  .chip { align-self:flex-start; font:500 12px/1 var(--font); padding:4px 10px; border:1px solid rgba(22,25,29,.35); border-radius:999px; }
  .row { display:flex; justify-content:space-between; font:500 14px/1 var(--font); color:var(--mut); }
  .row b { color:var(--ink); font-weight:500; }
  /* look switch — a dev control for choosing the recipe, not shop UI */
  .look { position:fixed; z-index:4; left:12px; top:calc(8px + env(safe-area-inset-top)); display:flex; gap:4px; padding:4px;
    background:rgba(255,255,255,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(0,0,0,.1); border-radius:999px; font:500 11px/1 ui-monospace,Menlo,monospace; }
  .look button { border:0; background:none; padding:8px 11px; border-radius:999px; cursor:pointer; font:inherit; color:var(--ink); text-transform:uppercase; }
  .look button.on { background:var(--ink); color:#fff; }
  .hint { position:fixed; z-index:4; left:14px; top:calc(52px + env(safe-area-inset-top)); text-align:left; font:500 10px/1.4 ui-monospace,Menlo,monospace; color:var(--mut); max-width:220px; }
</style>
</head>
<body>
<canvas id="surface" aria-hidden="true"></canvas>
<div class="app">
  <div class="top"><button class="bag" aria-label="Bag"><svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="round"><path d="M40 72h176l-12 144H52z"/><path d="M88 96V72a40 40 0 0 1 80 0v24"/></svg><i>1</i></button></div>
  <div class="reel" id="reel"></div>
</div>
<div class="look" id="look">
  <button data-r="A">A spec</button><button data-r="B">B print</button><button data-r="C">C fibres</button><button data-r="D">D live</button><button data-r="E" class="on">E archive</button><button id="tilt">tilt</button>
</div>
<div class="hint">swipe up: next Effect · tap the Effect: turn it over · move the mouse or tilt: light</div>

<script type="module">
import { createSurface } from './public/recipes/onemo-adaptive-surface.js';
const ARTS=[1,2,3,4,5,6].map(i=>`public/recipes/art${i}.jpg`);
const NAMES=['Thriller','Anti-Aging Pill','Lipstick','The Hand','Diamond','Cinema'];
const R={ A:{print:0,real:0,live:0}, B:{print:1,real:0,live:0}, C:{print:1,real:1,live:0}, D:{print:1,real:1,live:1}, E:{print:1,real:0,live:0,arch:1} };
const st={ recipe:'E', light:{x:.31,y:.33}, live:null };
const deg=Math.PI/180; st.light={x:Math.cos(46*deg)*Math.cos(63*deg), y:Math.sin(46*deg)*Math.cos(63*deg)};

const VS=`attribute vec2 a; varying vec2 v; void main(){ v=vec2(a.x*.5+.5,.5-a.y*.5); gl_Position=vec4(a,0.,1.); }`;
const FS=`precision highp float; varying vec2 v;
uniform sampler2D ART,GRAIN,NRM,G2; uniform vec2 PX; uniform float PRINT,REAL,BACK,ARCH; uniform vec3 L;
vec3 ov(vec3 a,vec3 b){ return mix(2.*a*b,1.-2.*(1.-a)*(1.-b),step(.5,a)); }
void main(){ vec3 c;
  if(BACK>.5) c=ARCH>.5?vec3(168./255.):vec3(61./255.);
  else if(PRINT>.5){ vec2 o=PX*.5; c=(texture2D(ART,v).rgb*4.+texture2D(ART,v+vec2(o.x,0)).rgb+texture2D(ART,v-vec2(o.x,0)).rgb+texture2D(ART,v+vec2(0,o.y)).rgb+texture2D(ART,v-vec2(0,o.y)).rgb)/8.;
    float l=dot(c,vec3(.299,.587,.114)); c=mix(vec3(l),c,.88); c=.06+.94*c; }
  else c=texture2D(ART,v).rgb;
  if(REAL>.5){ vec3 n=texture2D(NRM,v).rgb*2.-1.; n=normalize(vec3(n.xy*2.7,n.z)); vec3 Ld=normalize(L);
    float d=max(dot(n,Ld),0.)/max(Ld.z,.05); c*=mix(1.,d,.85); c+=.11*pow(1.-n.z,1.2)*max(dot(normalize(n.xy+1e-4),normalize(Ld.xy+1e-4)),0.); }
  c=ARCH>.5?ov(c,texture2D(G2,v).rgb):ov(c,texture2D(GRAIN,v).rgb);
  float r=distance(v,vec2(.22,.22))/.66; c+=vec3(.12)*(1.-smoothstep(0.,1.,r));
  gl_FragColor=vec4(clamp(c,0.,1.),1.); }`;
const cache={}; const img=s=>cache[s]||(cache[s]=new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=s; }));
const fit=(im,s)=>{ const c=document.createElement('canvas'); c.width=c.height=s; const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(im,0,0,s,s); return c; };

// ONE shared WebGL renderer paints every card face into a plain 2D canvas (12 live GL contexts was the fps cost)
const DPR=Math.min(2,devicePixelRatio||1), SZ=Math.round(304*DPR);
const R3=(()=>{ const cv=document.createElement('canvas'); cv.width=cv.height=SZ; const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
  const sh=(t,src)=>{ const o=gl.createShader(t); gl.shaderSource(o,src); gl.compileShader(o); return o; };
  const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(p); gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const a=gl.getAttribLocation(p,'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(p,n); const T={};
  const mk=src=>{ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);
    [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(([k,v])=>gl.texParameteri(gl.TEXTURE_2D,k,v)); return t; };
  const bind=(u,n,t)=>{ gl.activeTexture(gl.TEXTURE0+u); gl.bindTexture(gl.TEXTURE_2D,t); gl.uniform1i(U(n),u); };
  const shared=Promise.all([img('public/recipes/grain-dan-spec.png'),img('public/recipes/suede-normal.png'),img('public/recipes/suede-archive-render.png')]).then(([g,n,g2])=>{ T.g=mk(fit(g,SZ)); T.n=mk(fit(n,SZ)); T.g2=mk(fit(g2,SZ)); });
  const art=src=>T[src]||(T[src]=img(src).then(i=>mk(fit(i,SZ))));
  return { cv, async render(src,back){ await shared; const at=await art(src); const r=R[st.recipe];
    gl.useProgram(p); gl.viewport(0,0,SZ,SZ); bind(0,'ART',at); bind(1,'GRAIN',T.g); bind(2,'NRM',T.n); bind(3,'G2',T.g2);
    gl.uniform2f(U('PX'),1/SZ,1/SZ); gl.uniform1f(U('PRINT'),r.print); gl.uniform1f(U('REAL'),r.real); gl.uniform1f(U('BACK'),back?1:0); gl.uniform1f(U('ARCH'),r.arch?1:0);
    const li=(r.live&&st.live)||st.light; const z=Math.sqrt(Math.max(.05,1-li.x*li.x-li.y*li.y)); gl.uniform3f(U('L'),li.x,li.y,z); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); } };
})();
let chain=Promise.resolve();   // one renderer → paint faces one after another
function face(canvas, art, back){ canvas.width=canvas.height=SZ; const ctx=canvas.getContext('2d');
  return { draw(){ chain=chain.then(async()=>{ await R3.render(art,back); ctx.drawImage(R3.cv,0,0); }); return chain; } }; }

const reel=document.getElementById('reel'); const faces=[];
ARTS.forEach((src,i)=>{ const el=document.createElement('section'); el.className='slide'; el.innerHTML=`
  <div class="stage"><div class="turn"><div class="flip"><div class="face f"><canvas></canvas></div><div class="face b"><canvas></canvas></div></div></div>
  <div class="dots"><b class="on"></b><b></b></div></div>
  <div class="info"><div class="name">${NAMES[i]}</div><span class="chip">Made to order</span><div class="row"><span>Mini · 68 mm</span><b>£ —</b></div></div>`;
  reel.appendChild(el); const [cf,cb]=el.querySelectorAll('canvas'); const F=face(cf,src,false), B=face(cb,src,true); faces.push(F,B);
  const flip=el.querySelector('.flip'), dots=el.querySelectorAll('.dots b');
  el.querySelector('.turn').onclick=()=>{ const on=flip.classList.toggle('back'); dots[0].classList.toggle('on',!on); dots[1].classList.toggle('on',on); };
});
const drawAll=()=>faces.forEach(f=>f.draw()); drawAll();

// the shop background — the build's own engine, adapting to the Effect on screen
const surface=createSurface({ canvas:document.getElementById('surface'), mode:'adaptive', maxPixelRatio:1 });
const idx=()=>Math.round(reel.scrollTop/reel.clientHeight);
surface?.adoptImage(ARTS[0]);
reel.addEventListener('scroll',()=>{ const t=reel.scrollTop/reel.clientHeight, i=Math.floor(t); surface?.blendImages(ARTS[Math.max(0,Math.min(5,i))],ARTS[Math.min(5,i+1)],t-i); },{passive:true});
addEventListener('resize',()=>surface?.resize());

// look switch + light
document.querySelectorAll('#look [data-r]').forEach(b=>b.onclick=()=>{ st.recipe=b.dataset.r; document.querySelectorAll('#look [data-r]').forEach(x=>x.classList.toggle('on',x===b)); drawAll(); });
const near=()=>[faces[idx()*2]];   // live light repaints only the card on screen
let raf=0; const relight=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; near().forEach(f=>f.draw()); }); };
addEventListener('pointermove',e=>{ if(st.recipe!=='D') return; st.live={x:(e.clientX/innerWidth-.5)*1.4, y:-(e.clientY/innerHeight-.5)*1.4}; relight(); });
document.getElementById('tilt').onclick=async e=>{ try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(_){}
  e.target.classList.add('on'); addEventListener('deviceorientation',ev=>{ if(st.recipe!=='D') return; st.live={x:Math.max(-.7,Math.min(.7,(ev.gamma||0)/45)), y:Math.max(-.7,Math.min(.7,((ev.beta||45)-45)/45))}; relight(); }); };
</script>
</body>
</html>
