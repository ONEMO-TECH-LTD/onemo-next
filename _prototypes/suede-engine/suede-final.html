<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>ONEMO shop · Effect reel</title>
<link rel="stylesheet" href="public/recipes/tokens.css"/>
<style>
  :root { --ink:#16191d; --mut:#6b737c; --font:"Chillax","Satoshi",ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:ui-monospace,Menlo,monospace; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#e8e8ec; color:var(--ink); font-family:var(--font); }
  #surface { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }
  .app { position:relative; z-index:1; height:100%; max-width:402px; margin:0 auto; }
  .top { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:16px; right:16px; z-index:3; display:flex; justify-content:flex-end; pointer-events:none; }
  .bag { pointer-events:auto; position:relative; width:28px; height:28px; display:grid; place-items:center; border:0; background:none; color:var(--ink); cursor:pointer; }
  .bag svg { width:22px; height:22px; }
  .bag i { position:absolute; top:-3px; right:-5px; min-width:16px; height:16px; border-radius:8px; background:var(--ink); color:#fff; font:600 10px/16px var(--font); font-style:normal; text-align:center; }
  .reel { height:100%; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; overscroll-behavior:contain; }
  .reel::-webkit-scrollbar { display:none; }
  .slide { height:100%; scroll-snap-align:start; scroll-snap-stop:always; display:flex; flex-direction:column; justify-content:space-between; padding:calc(54px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom)); }
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cardwrap { position:relative; width:304px; height:304px; }   /* shadow layers sit outside the 3D flip, always underneath */
  .turn { position:relative; z-index:1; width:304px; height:304px; perspective:1200px; cursor:pointer; border-radius:52px; }
  .cardwrap .sh { position:absolute; z-index:0; inset:0; border-radius:52px; background:#0a0d12; pointer-events:none; opacity:0; will-change:transform,filter,opacity; }
  .flip { position:relative; z-index:1; width:100%; height:100%; transition:transform .7s cubic-bezier(.45,0,.55,1); }
  .flip.d3 { transform-style:preserve-3d; }
  .flip.back { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:52px; overflow:hidden; }
  .d3 .face { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face.b { transform:rotateY(180deg); display:none; }
  .d3 .face.b { display:block; }
  .face canvas { width:100%; height:100%; display:block; }
  .dots { display:flex; gap:8px; align-items:center; }
  .dots b { width:6px; height:6px; border-radius:3px; background:rgba(22,25,29,.3); transition:width .2s; }
  .dots b.on { width:14px; background:var(--ink); }
  .info { display:flex; flex-direction:column; gap:8px; }
  .name { font:500 18px/1.1 var(--font); }
  .chip { align-self:flex-start; font:500 12px/1 var(--font); padding:4px 10px; border:1px solid rgba(22,25,29,.35); border-radius:999px; }
  .row { display:flex; justify-content:space-between; font:500 14px/1 var(--font); color:var(--mut); }
  .row b { color:var(--ink); font-weight:500; }
  /* dev controls — not shop UI */
  .dev { position:fixed; z-index:5; left:12px; top:calc(8px + env(safe-area-inset-top)); display:flex; gap:4px; padding:4px; flex-wrap:wrap; max-width:calc(100vw - 24px);
    background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.1); border-radius:18px; font:500 11px/1 var(--mono); }
  .dev button { border:0; background:none; padding:8px 11px; border-radius:999px; cursor:pointer; font:inherit; color:var(--ink); text-transform:uppercase; }
  .dev button.on { background:var(--ink); color:#fff; }
  .sheet { position:fixed; z-index:6; right:12px; top:calc(56px + env(safe-area-inset-top)); width:min(340px,calc(100vw - 24px)); max-height:calc(100vh - 80px); overflow:auto;
    background:rgba(255,255,255,.96); border:1px solid rgba(0,0,0,.1); border-radius:16px; padding:12px 14px; font:500 11px/1.3 var(--mono); display:none; }
  .sheet.open { display:block; }
  .sheet h4 { font:700 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:12px 0 6px; }
  .ctl { display:grid; grid-template-columns:auto 1fr auto 58px; align-items:center; column-gap:6px; row-gap:2px; margin:6px 0; }
  .ctl span { grid-column:1/-1; }
  .ctl small { font-size:9px; color:var(--mut); font-variant-numeric:tabular-nums; }
  .ctl .num::-webkit-inner-spin-button, .ctl .num::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .ctl .num { -moz-appearance:textfield; width:58px; font:inherit; padding:3px 4px; border:1px solid rgba(0,0,0,.18); border-radius:6px; text-align:right; background:#fff; }
  .ctl input[type=range] { width:100%; accent-color:var(--ink); }
  .seg { display:flex; gap:4px; flex-wrap:wrap; margin:4px 0; }
  .seg button, .acts button { border:1px solid rgba(0,0,0,.14); background:#fff; border-radius:999px; padding:6px 10px; font:inherit; cursor:pointer; text-transform:uppercase; }
  .seg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .sheet details { border-top:1px solid rgba(0,0,0,.08); margin-top:8px; }
  .sheet summary { cursor:pointer; padding:8px 0 4px; font:700 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink); }
  .sheet .ver { width:100%; margin:6px 0 2px; font:inherit; padding:6px 8px; border:1px solid rgba(0,0,0,.18); border-radius:8px; background:#fff; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .who { font:700 12px/1.2 var(--font); margin-bottom:4px; }
  /* light handle: drag to place the light; it always shines on the card */
  .lamp { position:fixed; z-index:4; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; touch-action:none; cursor:grab;
    background:radial-gradient(circle,#fff 0 35%,#ffe9a8 60%,rgba(255,220,120,.0) 72%); box-shadow:0 0 0 1.5px rgba(22,25,29,.55),0 0 18px 6px rgba(255,236,170,.55); }
  .lamp.off { display:none; } .lamp:active { cursor:grabbing; }
  .lampline { position:fixed; z-index:3; height:1px; background:rgba(22,25,29,.35); transform-origin:0 50%; pointer-events:none; }
  /* phone: one scrolling row of dev switches; the panel is a bottom sheet that leaves the card visible */
  @media (max-width:600px) {
    .dev { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; right:56px; max-width:none; border-radius:999px; font-size:10px; }
    .dev::-webkit-scrollbar { display:none; }
    .dev button { white-space:nowrap; padding:7px 9px; }
    .sheet { left:0; right:0; top:auto; bottom:0; width:auto; max-height:38vh; border-radius:16px 16px 0 0; border-width:1px 0 0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
    .ctl { margin:4px 0; }
    .ctl { grid-template-columns:auto 1fr auto 70px; }
    .ctl .num { width:70px; font-size:16px; }   /* 16px stops iOS zooming on focus */
    .ctl input[type=range] { height:28px; }
  }
</style>
</head>

<script type="module">
import { createSurface } from './public/recipes/onemo-adaptive-surface.js';
import { createThreeCard, MATERIALS as M3, STUDIOS, DEFAULT_STUDIO } from './three-card.js';
const ARTS=[1,2,3,4,5,6].map(i=>`public/recipes/608/art${i}.jpg`);
const NAMES=['Thriller','Anti-Aging Pill','Lipstick','The Hand','Diamond','Cinema'];
const deg=Math.PI/180;

/* ── per-card material settings ─────────────────────────────────────── */
const PRESETS={
  /* tuned per material for a realistic read — light from the top right */
  'old Suede':{print:1,soften:.18,lift:.1,blur:.8, fibres:0,fscale:4,relief:.2,fmix:.5,fsheen:.06, layer:'none',lamt:1,lscale:1, live:0, sheen:0, az:40,el:48,
    pbr:1,pnsrc:'suede',ptile:2.5,pnorm:.5,psheen:.6,pshrough:.7,pshtint:.3,pspec:0,prough:1,pcoat:0,pcoatr:.1,penv:0,pkey:1,pamb:.42,pexpo:1.35,haze:.14,
    proc:1,ndens:120,nstretch:2.5,ndir:35,nrelief:.35,namt:.8,wscale:1.4,wamt:.6,tips:.05,seed:7},
  'old Velvet':{print:1,soften:0,lift:.03,blur:.3, fibres:0,fscale:4,relief:.2,fmix:.5,fsheen:.06, layer:'none',lamt:1,lscale:1, live:0, sheen:0, az:40,el:30,
    pbr:1,pnsrc:'suede',ptile:6,pnorm:.9,psheen:2.5,pshrough:.35,pshtint:.9,pspec:0,prough:1,pcoat:0,pcoatr:.1,penv:0,pkey:1,pamb:.32,pexpo:1.3,haze:.05,
    proc:1,ndens:160,nstretch:1.6,ndir:70,nrelief:.3,namt:.5,wscale:1.8,wamt:.7,tips:0,seed:11},
  'old Faux leather':{print:1,soften:.04,lift:.03,blur:0, fibres:0,fscale:4,relief:.2,fmix:.5,fsheen:.06, layer:'none',lamt:1,lscale:1, live:0, sheen:0, az:40,el:50,
    pbr:1,pnsrc:'leather',ptile:2,pnorm:.5,psheen:0,pshrough:.8,pshtint:0,pspec:1.1,prough:.45,pcoat:0,pcoatr:.1,penv:0,pkey:1,pamb:.45,pexpo:1.3,

    pbr:1,pnsrc:'ink',ptile:1,pnorm:.12,psheen:0,pshrough:.8,pshtint:0,pspec:.55,prough:.72,pcoat:0,pcoatr:.1,penv:0,pkey:1,pamb:.5,pexpo:1.35,
    proc:0,ndens:150,nstretch:2,ndir:35,nrelief:.15,namt:0,wscale:1,wamt:0,tips:0,seed:7},
  'old UV gloss':{print:0,soften:0,lift:0,blur:0, fibres:0,fscale:4,relief:.2,fmix:.5,fsheen:.06, layer:'none',lamt:1,lscale:1, live:0, sheen:0, az:40,el:55,
    pbr:1,pnsrc:'flat',ptile:1,pnorm:0,psheen:0,pshrough:.8,pshtint:0,pspec:.6,prough:.08,pcoat:1,pcoatr:.03,penv:4.5,pkey:1,pamb:.5,pexpo:1.35,
    proc:0,ndens:150,nstretch:2,ndir:35,nrelief:.15,namt:0,wscale:1,wamt:0,tips:0,seed:7},
  A:{print:0,soften:0,lift:0,blur:0, fibres:0,fscale:1,relief:.45,fmix:.85,fsheen:.11, layer:'grain',lamt:1,lscale:1, az:46,el:63,live:0, sheen:.12},
  B:{print:1,soften:.12,lift:.06,blur:.5, fibres:0,fscale:1,relief:.45,fmix:.85,fsheen:.11, layer:'grain',lamt:1,lscale:1, az:46,el:63,live:0, sheen:.12},
  'B+fine fibres':{print:1,soften:.12,lift:.06,blur:.5, fibres:1,fscale:4,relief:.2,fmix:.5,fsheen:.06, layer:'grain',lamt:1,lscale:1, az:46,el:63,live:0, sheen:.12},
  E:{print:1,soften:.12,lift:.06,blur:.5, fibres:0,fscale:1,relief:.45,fmix:.85,fsheen:.11, layer:'archive',lamt:1,lscale:1, az:46,el:63,live:0, sheen:.12},
  '3D viewer suede':{print:1,soften:.12,lift:.06,blur:.5, fibres:0,fscale:4,relief:.2,fmix:.5,fsheen:.06, layer:'none',lamt:1,lscale:1, az:46,el:63,live:0, sheen:0,
    proc:0, pbr:1,ptile:3,pnorm:.15,psheen:.1,pshrough:.8,pamb:.5,pkey:1,pexpo:1.43},
  'Shader suede':{print:1,soften:.12,lift:.06,blur:.5, fibres:0,fscale:4,relief:.2,fmix:.5,fsheen:.06, layer:'none',lamt:1,lscale:1, az:46,el:63,live:0, sheen:.12,
    proc:1,ndens:60,nstretch:3,ndir:35,nrelief:.45,namt:1,wscale:1,wamt:.35,tips:.1,seed:7},
};
const MATS=['Suede','Velvet','Faux leather','UV matte','UV gloss'];
const BACKS=MATS.filter(m=>m!=='Velvet');   // the back is never velvet
for(const n of [...MATS,'Suede · scan','Velvet · scan']){ const t={}; for(const k in M3[n]) if(k!=='scan'&&k!=='studio') t['t_'+k]=M3[n][k]; if(M3[n].studio) t.studio=M3[n].studio; t.t_amb??=.6; PRESETS[n]={engine:'three',mat3:n,az:40,el:50,live:0,dist:1.5,rimMm:3,rimAng:60,rimSoft:.6,rimHi:.15,rimShade:.25,rimSheen:.3,lift:6,shadow:.5,shBlur:.5,shSpread:0,shDist:1,shContact:1,...t}; }   // fabrics + gloss read through moving light   // proven: three.js + Poly Haven
const KEY='onemo-materials';   // stable: never renamed again, so your settings survive page updates
let cards; try{ cards=JSON.parse(localStorage.getItem(KEY)); if(!cards) for(let v=20;v>=11&&!cards;v--) cards=JSON.parse(localStorage.getItem('onemo-materials-v'+v)); }catch(_){}
const fresh=i=>{ const m=MATS[i%MATS.length]; return {...PRESETS[m],mat:m,backMat:'Suede'}; };   // one material per card to start
cards=ARTS.map((_,i)=>{ const c=Array.isArray(cards)&&cards[i]; return c&&c.mat&&PRESETS[c.mat] ? {...PRESETS[c.mat],backMat:'Suede',...c} : c||fresh(i); });   // new controls get preset values, yours win
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(cards)); }catch(_){} };
const st={ live:null };

/* ── one shared WebGL renderer, painting faces into plain 2D canvases ─ */
const VS=`attribute vec2 a; varying vec2 v; void main(){ v=vec2(a.x*.5+.5,.5-a.y*.5); gl_Position=vec4(a,0.,1.); }`;
const FS=`precision highp float; varying vec2 v;
uniform sampler2D ART,GRAIN,NRM,ARCH; uniform vec2 PX;
uniform float BACK,PRINT,SOFT,LIFT,BLUR,FIB,FSCALE,RELIEF,FMIX,FSHEEN,LAYER,LAMT,LSCALE,SHEEN; uniform vec3 L;
uniform float PROC,NDENS,NSTRETCH,NDIR,NRELIEF,NAMT,WSCALE,WAMT,TIPS,SEED; uniform float SZPX;
vec3 ov(vec3 a,vec3 b){ return mix(2.*a*b,1.-2.*(1.-a)*(1.-b),step(.5,a)); }
/* 2D simplex noise (Ashima / Gustavson, MIT) */
vec3 m289(vec3 x){return x-floor(x*(1./289.))*289.;} vec2 m289(vec2 x){return x-floor(x*(1./289.))*289.;} vec3 perm(vec3 x){return m289(((x*34.)+1.)*x);}
float sn(vec2 v){ const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx); vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.); vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=m289(i);
  vec3 p=perm(perm(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.)); vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.); m=m*m; m=m*m;
  vec3 x=2.*fract(p*C.www)-1.; vec3 h=abs(x)-.5; vec3 ox=floor(x+.5); vec3 a0=x-ox; m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw; return 130.*dot(m,g); }
uniform float PBR,PNSCALE,PNORM,PSHEEN,PSHROUGH,PAMB,PKEY,PEXPO,PTILE;
uniform float PNSRC,PSHTINT,PSPEC,PROUGH,PCOAT,PCOATR,PENV,HAZE;
float D_GGX(float a,float nh){ float a2=a*a; float d=nh*nh*(a2-1.)+1.; return a2/(3.14159*d*d); }
float V_SmithGGX(float a,float nv,float nl){ float a2=a*a; return .5/max(nl*sqrt(nv*nv*(1.-a2)+a2)+nv*sqrt(nl*nl*(1.-a2)+a2),1e-4); }
vec3 F_Schlick(vec3 f0,float vh){ return f0+(1.-f0)*pow(clamp(1.-vh,0.,1.),5.); }
vec2 h22(vec2 p){ p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
/* leather pebble grain: rounded cells with creases between them */
float leather(vec2 x){ vec2 n=floor(x), f=fract(x); float d1=8., d2=8.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g=vec2(float(i),float(j)); vec2 o=h22(n+g); vec2 r=g+o-f; float d=dot(r,r); if(d<d1){ d2=d1; d1=d; } else if(d<d2) d2=d; }
  float cell=1.-smoothstep(0.,.55,sqrt(d1)); float crease=smoothstep(0.,.12,sqrt(d2)-sqrt(d1)); return cell*.6+crease*.4; }
float D_Charlie(float r,float nh){ float a=r*r, ia=1./a, c2=nh*nh, s2=max(1.-c2,.0078125); return (2.+ia)*pow(s2,ia*.5)/6.2831853; }
float V_Neubelt(float nv,float nl){ return clamp(1./(4.*(nl+nv-nl*nv)),0.,1.); }
vec3 neutralTM(vec3 c){ const float sc=.8-.04, ds=.15; float x=min(c.r,min(c.g,c.b)); float off=x<.08?x-6.25*x*x:.04; c-=off; float pk=max(c.r,max(c.g,c.b)); if(pk<sc) return c;
  float d=1.-sc; float np=1.-d*d/(pk+d-sc); c*=np/pk; float g=1.-1./(ds*(pk-np)+1.); return mix(c,vec3(np),g); }
vec3 srgb2lin(vec3 c){ return pow(c,vec3(2.2)); } vec3 lin2srgb(vec3 c){ return pow(max(c,0.),vec3(1./2.2)); }
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7))+SEED)*43758.5453); }
/* nap height: fibres = fine noise stretched along the nap direction, 3 octaves */
float nap(vec2 px){ float c=cos(NDIR),s=sin(NDIR); vec2 q=mat2(c,-s,s,c)*px; q.x/=max(NSTRETCH,1.); q*=NDENS/100.; q+=SEED*7.;
  return .55*sn(q)+.3*sn(q*2.03+11.)+.15*sn(q*4.11+23.); }
void main(){ vec3 c;
  if(BACK>.5) c=vec3(61./255.);
  else if(PRINT>.5 && BLUR>0.){ vec2 o=PX*BLUR; c=(texture2D(ART,v).rgb*4.+texture2D(ART,v+vec2(o.x,0)).rgb+texture2D(ART,v-vec2(o.x,0)).rgb+texture2D(ART,v+vec2(0,o.y)).rgb+texture2D(ART,v-vec2(0,o.y)).rgb)/8.; }
  else c=texture2D(ART,v).rgb;
  if(PRINT>.5 && BACK<.5){ float l=dot(c,vec3(.299,.587,.114)); c=mix(c,vec3(l),SOFT); c=LIFT+(1.-LIFT)*c; }
  if(FIB>.5){ vec3 n=texture2D(NRM,v*FSCALE).rgb*2.-1.; n=normalize(vec3(n.xy*RELIEF*6.,n.z)); vec3 Ld=normalize(L);
    float d=max(dot(n,Ld),0.)/max(Ld.z,.05); c*=mix(1.,d,FMIX); c+=FSHEEN*pow(1.-n.z,1.2)*max(dot(normalize(n.xy+1e-4),normalize(Ld.xy+1e-4)),0.); }
  if(PBR>.5){
    vec3 n=vec3(0.,0.,1.); vec2 px=v*SZPX;
    if(PNSRC<.5){ vec3 nt=texture2D(NRM,v*PTILE).rgb*2.-1.; n=normalize(vec3(nt.xy*PNORM,nt.z)); }                 // suede / velvet: real GSG fibres
    else if(PNSRC<1.5){ vec2 q=px*PTILE*.08; float e=.02; float h=leather(q), hx=leather(q+vec2(e,0.)), hy=leather(q+vec2(0.,e));
      n=normalize(vec3((h-hx)/e*PNORM*.05,(h-hy)/e*PNORM*.05,1.)); }                                                 // faux leather: pebble grain
    else if(PNSRC<2.5){ vec2 q=px*PTILE*.5; n=normalize(vec3((h22(floor(q)).xy-.5)*PNORM*.4,1.)); }                     // UV print: faint ink texture
    vec3 P=vec3(v.x-.5,.5-v.y,0.);                       // the card point, card width = 1
    vec3 V=normalize(vec3(0.,0.,1.8)-P);                 // seen from ~1.8 card widths away, so highlights form a spot
    vec3 Ld=normalize(normalize(L)*2.2-P); vec3 Ldir=normalize(L);               // light as a lamp near the card, so its highlight has a place
    vec3 H=normalize(Ld+V);
    float nl=clamp(dot(n,Ld),0.,1.), nv=clamp(dot(n,V),1e-3,1.), nh=clamp(dot(n,H),0.,1.), vh=clamp(dot(V,H),0.,1.);

  az:s=>s.engine==='three'||s.pbr||s.fibres||s.proc, el:s=>s.engine==='three'||s.pbr||s.fibres||s.proc };
function ctlHtml(s,[k,label,a,b,stp,inv]){
  if(a==='toggle') return `<div class="seg"><button data-tog="${k}" class="${s[k]?'on':''}">${label}: ${s[k]?'ON':'OFF'}</button></div>`;
  if(a==='seg') return `<div class="seg">${b.map(o=>`<button data-seg="${k}" data-v="${o}" class="${(s[k]??(k==='studio'?DEFAULT_STUDIO:undefined))===o?'on':''}">${o}</button>`).join('')}</div>`;
  const ui=inv?a+b-(s[k]??0):(s[k]??0), f=v=>(+v).toFixed(stp<.01?3:2);
  return `<div class="ctl"><span>${label}</span><small>${f(a)}</small><input type="range" data-k="${k}" data-inv="${inv?1:0}" data-a="${a}" data-b="${b}" min="${a}" max="${b}" step="${stp}" value="${ui}"><small>${f(b)}</small><input type="number" class="num" data-k="${k}" step="${stp}" value="${f(ui)}"></div>`; }
function renderSheet(){ const i=idx(), s=cards[i];
  const acts=k=>{ if(VIS[k]&&!VIS[k](s)) return false; const three=s.engine==='three', isT=k.startsWith('t_'), light=['az','el','live','studio','dist','rimMm','rimAng','rimSoft','rimHi','rimShade','rimSheen','lift','shadow','shBlur','shSpread','shDist','shContact'].includes(k); return three ? (isT||light) : !isT; };   // only what acts on this card
  const cur=MATS.includes(s.mat);
  let h=`<div class="who">${NAMES[i]} · card ${i+1}</div>
    <h4>Material</h4><div class="seg">${MATS.map(k=>`<button data-preset="${k}" class="${s.mat===k?'on':''}">${k}</button>`).join('')}</div>
    <select id="ver" class="ver"><option value="" ${cur?'selected':''}>${CURRENT}</option><optgroup label="Earlier versions">${Object.keys(PRESETS).filter(k=>!MATS.includes(k)).sort((x,y)=>(VNAME[y]||'').localeCompare(VNAME[x]||'')).map(k=>`<option value="${k}" ${s.mat===k?'selected':''}>${VNAME[k]||k}</option>`).join('')}</optgroup></select>
    <h4>Back material</h4><div class="seg">${BACKS.map(k=>`<button data-back="${k}" class="${(s.backMat||'Suede')===k?'on':''}">${k}</button>`).join('')}</div>`;
  const key=s.engine==='three' ? KEYCTL[FAB(s)?'fabric':'surface'].filter(acts) : [];
  if(key.length) h+=`<h4>Key controls — ${s.mat}</h4>`+key.map(k=>ctlHtml(s,DEF[k])).join('');
  for(const [title,list,open] of CTL){ const body=list.filter(c=>acts(c[0])&&!key.includes(c[0])).map(c=>ctlHtml(s,c)).join(''); if(!body) continue;
    const o=OPEN[title]??!!open; h+=`<details data-sec="${title}" ${o?'open':''}><summary>${title}</summary>${body}</details>`; }
  h+=`<div class="acts"><button id="all">apply to all cards</button><button id="copy">copy spec</button></div>`;
  sheet.innerHTML=h;
  const C=()=>cards[i];   // always the card's CURRENT settings — presets/apply-all replace the object
  const store=(r,ui)=>{ C()[r.dataset.k]= r.dataset.inv==='1' ? +r.dataset.a + +r.dataset.b - ui : ui; save(); paintCard(i); if(typeof placeLamp==='function') placeLamp(); };   // inverted controls store the opposite end
  sheet.querySelectorAll('input[type=range]').forEach(r=>{ const num=r.parentElement.querySelector('.num');
    r.oninput=()=>{ num.value=(+r.value).toFixed(+r.step<.01?3:2); store(r,+r.value); };
    num.onchange=()=>{ const v=+num.value; if(!isFinite(v)) return; r.value=v; store(r,v); };   // typed values may go past the slider's ends
  });
  sheet.querySelectorAll('details').forEach(d=>d.ontoggle=()=>{ OPEN[d.dataset.sec]=d.open; try{ localStorage.setItem('onemo-panel-open',JSON.stringify(OPEN)); }catch(_){} if(typeof syncLamp==='function') syncLamp(); });
  if(typeof syncLamp==='function') syncLamp();
  const pick=name=>{ cards[i]={...PRESETS[name],mat:name,backMat:C().backMat||'Suede'}; save(); renderSheet(); paintCard(i); };
  sheet.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>pick(b.dataset.preset));
  sheet.querySelector('#ver').onchange=e=>{ if(e.target.value) pick(e.target.value); else if(!cur) pick(MATS[0]); };
  sheet.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{ C()[b.dataset.tog]=C()[b.dataset.tog]?0:1; save(); renderSheet(); paintCard(i); });
  sheet.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{ C()[b.dataset.seg]=b.dataset.v; save(); renderSheet(); paintCard(i); });
  sheet.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ C().backMat=b.dataset.back; save(); renderSheet(); paintCard(i); });
  sheet.querySelector('#all').onclick=()=>{ const cur=C(); cards=cards.map(()=>({...cur})); save(); painted.clear(); paintCard(idx()); paintCard(idx()+1); paintCard(idx()-1); };
  sheet.querySelector('#copy').onclick=async e=>{ const t=JSON.stringify(C()); try{ await navigator.clipboard.writeText(t); e.target.textContent='copied'; }catch(_){ prompt('Spec',t); } };
}

let lastIdx=-1; reel.addEventListener('scroll',()=>{ const i=idx(); if(i!==lastIdx){ lastIdx=i; if(sheet.classList.contains('open')) renderSheet(); } },{passive:true});
document.getElementById('tune').onclick=e=>{ const on=sheet.classList.toggle('open'); e.target.classList.toggle('on',on); e.target.textContent=on?'panel: ON':'panel: OFF'; if(on) renderSheet(); if(typeof syncLamp==='function') syncLamp(); };
renderSheet();
window.__dev={ cards:()=>cards, set:(i,o)=>{ Object.assign(cards[i],o); save(); paintCard(i); return chain; }, preset:(i,m)=>{ cards[i]={...PRESETS[m],mat:m}; save(); paintCard(i); return chain; }, idx };

/* ── live light (only cards whose setting says so) ──────────────────── */
let raf=0; const relight=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; const i=idx(); if(cards[i].live||st.tiltOn) faces[i*2].draw(); }); };
addEventListener('pointermove',e=>{ st.live={x:(e.clientX/innerWidth-.5)*1.4, y:-(e.clientY/innerHeight-.5)*1.4}; relight(); });
document.getElementById('tilt').onclick=async e=>{ try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(_){}
  if(st.tiltOn){ st.tiltOn=false; st.tilt=null; e.target.classList.remove('on'); e.target.textContent='phone tilt: OFF'; paintCard(idx()); return; }
  if(!window.isSecureContext){ e.target.textContent='phone tilt: needs https'; return; }   // iPhone only gives motion to secure pages
  st.tiltOn=true; st.tilt0=null; e.target.classList.add('on'); e.target.textContent='phone tilt: ON';
  if(!st.tiltBound){ st.tiltBound=true; addEventListener('deviceorientation',ev=>{ if(!st.tiltOn||ev.beta==null) return; st.tilt0??={b:ev.beta,g:ev.gamma};   // zero = how you hold it now
    const cl=v=>Math.max(-.6,Math.min(.6,v)); st.tilt={x:cl((ev.gamma-st.tilt0.g)/30), y:cl(-(ev.beta-st.tilt0.b)/30)}; relight(); }); } };

/* ── light handle ───────────────────────────────────────────────────── */
const lamp=document.createElement('div'); lamp.className='lamp'; const lline=document.createElement('div'); lline.className='lampline'; document.body.append(lline,lamp);
const cardBox=()=>document.querySelectorAll('.slide')[idx()].querySelector('.turn').getBoundingClientRect();
const RAD=()=>cardBox().width*.95;   // handle at the card centre = light straight on; at this radius = grazing
function placeLamp(){ const s=cards[idx()], b=cardBox(), cx=b.left+b.width/2, cy=b.top+b.height/2, r=Math.max(0,(90-(s.el??50))/80)*RAD(), a=(s.az??40)*Math.PI/180;
  const x=cx+Math.cos(a)*r, y=cy-Math.sin(a)*r; lamp.style.left=x+'px'; lamp.style.top=y+'px';
  const dx=cx-x, dy=cy-y; lline.style.left=x+'px'; lline.style.top=y+'px'; lline.style.width=Math.hypot(dx,dy)+'px'; lline.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`; }
let dragging=false;
lamp.onpointerdown=e=>{ dragging=true; lamp.setPointerCapture(e.pointerId); e.preventDefault(); };
lamp.onpointermove=e=>{ if(!dragging) return; const i=idx(), b=cardBox(), dx=e.clientX-(b.left+b.width/2), dy=e.clientY-(b.top+b.height/2);
  const r=Math.min(1,Math.hypot(dx,dy)/RAD()); Object.assign(cards[i],{ az:Math.round((Math.atan2(-dy,dx)*180/Math.PI+360)%360), el:Math.round(90-r*80), live:0 });
  placeLamp(); if(!raf2){ raf2=requestAnimationFrame(()=>{ raf2=0; faces[i*2].draw(); faces[i*2+1].draw(); }); } };
let raf2=0;
lamp.onpointerup=()=>{ if(!dragging) return; dragging=false; save(); if(sheet.classList.contains('open')) renderSheet(); };
reel.addEventListener('scroll',placeLamp,{passive:true}); addEventListener('resize',placeLamp); setTimeout(placeLamp,50);
function syncLamp(){ if(!window.__lampReady) return;   // hoisted: renderSheet can call this before the handle exists
  const d=sheet.querySelector('details[data-sec="Light"]'), on=sheet.classList.contains('open')&&!!d&&d.open;   // handle only while Light settings are open
  lamp.style.display=lline.style.display=on?'':'none'; if(on) placeLamp(); }
window.__lampReady=true; syncLamp();
</script>
