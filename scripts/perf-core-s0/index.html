<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="data:,">
    <title>ONEMO perf-core S0 probe</title>
  </head>
  <body>
    <script type="module">
      import { createElement, useLayoutEffect, useRef } from 'react'
      import { createRoot } from 'react-dom/client'

      const SENTINEL = 'ONEMO_PERF_CORE_S0_SENTINEL_v1'
      const MAX_EXPORT_BYTES = 4096
      const spanId = 's0-span-0001'
      const requestId = 1
      const intendedKey = 's0-render-key-0001'
      const openedAt = performance.now()

      const fail = (message) => {
        window.__ONEMO_PERF_S0_STATUS__ = { status: 'FAIL', error: message }
        throw new Error(message)
      }

      function CommitProbe({ renderedKey, onObserved }) {
        const nodeRef = useRef(null)
        useLayoutEffect(() => {
          const node = nodeRef.current
          onObserved({
            matched: (
              node?.dataset.renderedKey === intendedKey
              && node?.dataset.evidence === SENTINEL
              && node?.textContent === SENTINEL
            ),
            at: performance.now(),
          })
        }, [renderedKey, onObserved])
        return createElement('output', {
          ref: nodeRef,
          hidden: true,
          'data-rendered-key': renderedKey,
          'data-evidence': SENTINEL,
        }, SENTINEL)
      }

      async function run() {
        const mount = document.createElement('div')
        mount.hidden = true
        document.body.append(mount)
        const root = createRoot(mount)
        const observeCommit = (renderedKey) => new Promise((resolve) => {
          root.render(createElement(CommitProbe, { renderedKey, onObserved: resolve }))
        })

        const wrongCommit = await observeCommit('wrong-key')
        if (wrongCommit.matched) fail('Wrong rendered key closed the commit probe.')

        const channel = new MessageChannel()
        const correlated = new Promise((resolve) => {
          channel.port1.onmessage = ({ data }) => resolve(data)
        })
        channel.port2.postMessage({ spanId, requestId })
        const correlation = await correlated
        channel.port1.close()
        channel.port2.close()
        if (correlation.spanId !== spanId || correlation.requestId !== requestId) {
          fail('Correlation identifiers changed across the message boundary.')
        }

        const matchingCommit = await observeCommit(intendedKey)
        if (!matchingCommit.matched) fail('Matching rendered key did not close the commit probe.')
        if (
          !Number.isFinite(openedAt)
          || !Number.isFinite(matchingCommit.at)
          || matchingCommit.at < openedAt
        ) {
          fail('Browser timestamps are unavailable or non-monotonic.')
        }

        const capabilities = {
          timestamps: true,
          correlation: true,
          commitDetection: true,
          export: true,
        }

        window.__ONEMO_PERF_S0_EXPORT__ = (metadata) => {
          for (const field of ['device', 'os', 'browser', 'surface']) {
            if (typeof metadata?.[field] !== 'string' || metadata[field].trim() === '') {
              throw new Error(`Missing required metadata: ${field}.`)
            }
          }
          const json = JSON.stringify({
            schemaVersion: 1,
            sentinel: SENTINEL,
            capabilities,
            correlation: { spanId, requestId },
            timestamps: { openedAt, committedAt: matchingCommit.at },
            metadata: {
              device: metadata.device,
              os: metadata.os,
              browser: metadata.browser,
              surface: metadata.surface,
              userAgent: navigator.userAgent,
            },
          })
          const bytes = new TextEncoder().encode(json).byteLength
          if (bytes > MAX_EXPORT_BYTES) {
            throw new Error(`Probe export exceeds ${MAX_EXPORT_BYTES} bytes.`)
          }
          return json
        }
        window.__ONEMO_PERF_S0_STATUS__ = { status: 'PASS', capabilities }
      }
      run().catch((error) => {
        if (window.__ONEMO_PERF_S0_STATUS__?.status !== 'FAIL') {
          window.__ONEMO_PERF_S0_STATUS__ = { status: 'FAIL', error: String(error) }
        }
        console.error(error)
      })
    </script>
  </body>
</html>
